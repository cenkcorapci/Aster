# M2-T10: larger recall@10 subsets (nightly). PR uses recall-gate.yml.
#
# Manual target: bazel test //aster/qa:recall_gate_nightly_test
# (tagged manual so `bazel test //aster/...` stays fast.)

name: Recall nightly

on:
  schedule:
    # 05:17 UTC daily (offset from top-of-hour to reduce shared-runner load)
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: recall-nightly-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  recall-nightly:
    name: Recall@10 ≥ 0.95 @ ef=128 (nightly subset)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-recall-nightly
          repository-cache: true
          cache-save: true

      - name: Run recall gate (nightly corpus)
        run: bazel test //aster/qa:recall_gate_nightly_test --test_output=all
