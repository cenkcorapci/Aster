name: Publish image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: false
        type: string
  push:
    tags:
      - "v*"
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/cenkcorapci/aster

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "ok ${{ github.event.inputs.tag || github.ref_name }}"
