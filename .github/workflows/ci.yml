name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          # PRs restore cache but do not overwrite the shared main cache.
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Run unit and integration tests
        run: |
          bazel test //aster/... \
            --test_output=errors \
            --test_summary=detailed \
            --build_tests_only

      - name: Collect test results
        if: always()
        run: |
          mkdir -p /tmp/test-results
          find bazel-testlogs -name "test.xml" -exec sh -c \
            'target=$(dirname "$1" | sed "s|bazel-testlogs/||;s|/|__|g"); \
             cp "$1" "/tmp/test-results/${target}.xml"' _ {} \;

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: /tmp/test-results/*.xml
          if-no-files-found: ignore

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Bazel Unit Tests
          path: /tmp/test-results/*.xml
          reporter: java-junit
          fail-on-error: false
