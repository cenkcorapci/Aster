name: Publish image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (default: ref name)
        required: false
        type: string
  push:
    tags:
      - "v*"
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/cenkcorapci/aster

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}"
          echo "tag=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install OpenSSL headers (Thrift TLS)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: publish-image-${{ matrix.arch }}
          repository-cache: true

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: IMAGE="${IMAGE_NAME}:${{ steps.meta.outputs.tag }}-${{ matrix.arch }}" ./scripts/docker-build.sh ${{ matrix.arch }}

      - name: Push image
        run: docker push "${IMAGE_NAME}:${{ steps.meta.outputs.tag }}-${{ matrix.arch }}"

  manifest:
    name: Multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}"
          echo "tag=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          T="${{ steps.meta.outputs.tag }}"
          for tag in "$T" latest; do
            docker buildx imagetools create -t "${IMAGE_NAME}:${tag}" \
              "${IMAGE_NAME}:${T}-amd64" "${IMAGE_NAME}:${T}-arm64"
          done
