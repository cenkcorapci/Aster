name: Publish image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/cenkcorapci/aster

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - run: echo "arch=${{ matrix.arch }} tag=${{ github.event.inputs.tag || github.ref_name }}"
