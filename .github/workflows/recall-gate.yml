# M2-T10: HNSW recall@10 CI gate (SIFT/GloVe-like subsets, ef_search=128).
#
# PR / push: fast deterministic subsets (regression gate).
# Covered again by unit-tests (`bazel test //aster/...`); this job makes the
# recall floor an explicit check status.

name: Recall gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: recall-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  recall-pr:
    name: Recall@10 ≥ 0.95 @ ef=128 (PR subset)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-recall-pr
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Run recall gate (PR corpus)
        run: bazel test //aster/qa:recall_gate_test --test_output=errors
