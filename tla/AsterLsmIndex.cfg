SPECIFICATION Spec

\* Both specs quiesce once writes are exhausted and background work drains;
\* that is termination, not deadlock.
CHECK_DEADLOCK FALSE

CONSTANTS
  Keys = {k1, k2}
  MaxWrites = 4
  MaxSegments = 3
  MaxCrashes = 2

INVARIANTS
  TypeOK
  SearchCompleteness
  NoResurrection
  WalTruncationSafe

PROPERTIES
  EventuallyAllIndexed
