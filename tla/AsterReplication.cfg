SPECIFICATION Spec

\* The cluster quiesces once writes are exhausted and replication drains;
\* that is termination, not deadlock.
CHECK_DEADLOCK FALSE

CONSTANTS
  Nodes = {n1, n2, n3}
  Keys = {k1}
  MaxWrites = 3
  WriteCLs = {"ONE", "QUORUM", "ALL"}

INVARIANTS
  TypeOK
  QuorumReadConsistent
  NoResurrectionQuorum
  AckedWriteSomewhere

PROPERTIES
  EventualConsistency
