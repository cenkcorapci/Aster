; Aster Tiny embedded Db on ESP32 — firmware-in-emulator suite.
; Build:  pio run -e esp32dev
; Host smoke (no QEMU): pio run -e native

[platformio]
default_envs = esp32dev
src_dir = src

[common]
build_flags =
	-DASTER_PROFILE_TINY=1
	-DASTER_BAREMETAL=1
	-I${PROJECT_DIR}/include
	-std=gnu++20
build_unflags =
	-std=gnu++11
	-std=gnu++14
	-std=gnu++17
	-fexceptions
	-frtti

; pioarduino ships GCC 12+ (C++20 / std::span). Stock PlatformIO espressif32 is GCC 8.
[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
build_flags =
	${common.build_flags}
	-fno-exceptions
	-fno-rtti
build_unflags = ${common.build_unflags}
build_src_filter = +<*> -<native_main.cpp>
extra_scripts = pre:extra_script.py

; Host compile of the same harness + Tiny sources (no MCU / QEMU).
[env:native]
platform = native
build_flags =
	${common.build_flags}
	-DNATIVE_HOST=1
build_unflags = ${common.build_unflags}
extra_scripts = pre:extra_script.py
build_src_filter = +<*> -<main.cpp>
