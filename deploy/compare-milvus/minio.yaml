# Shared MinIO for Aster shards and Milvus (externalS3).
# Service MUST NOT be named "minio" — Kubernetes injects MINIO_PORT=tcp://...
# into pods in the same namespace, which panics Milvus with:
#   Endpoint url cannot have fully qualified paths
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: compare-milvus
type: Opaque
stringData:
  rootUser: asterbench
  rootPassword: asterbench-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aster-minio
  namespace: compare-milvus
  labels:
    app: aster-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aster-minio
  template:
    metadata:
      labels:
        app: aster-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-12-18T13-15-44Z
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: rootPassword
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 32Gi
---
apiVersion: v1
kind: Service
metadata:
  name: aster-minio
  namespace: compare-milvus
spec:
  selector:
    app: aster-minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
# Job: create buckets for Aster sync + Milvus.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: compare-milvus
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-11-17T19-35-25Z
          imagePullPolicy: IfNotPresent
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: rootPassword
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until mc alias set local http://aster-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "waiting for aster-minio..."; sleep 2
              done
              mc mb -p local/aster-shards || true
              mc mb -p local/milvus-bucket || true
              mc anonymous set download local/milvus-bucket || true
              echo "buckets ready"
