[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aster-client"
version = "0.2.0"
description = "Python client for Aster, the peer-to-peer vector database (HTTP JSON transport)"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.9"
dependencies = []  # stdlib only (http.client)

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/cenkcorapci/Aster"

[tool.setuptools.packages.find]
include = ["aster*"]
